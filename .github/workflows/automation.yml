name: ALGORITHM Repository Automation

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "automation/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: algorithm-automation-${{ github.event.pull_request.number || github.ref || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace and patch errors
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              git diff --check "origin/main...HEAD"
            else
              git diff --check "$BEFORE" "${{ github.sha }}"
            fi
          fi

      - name: Validate JSON files
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          errors = []
          for path in pathlib.Path(".").rglob("*.json"):
              if ".git" in path.parts:
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("JSON validation passed.")
          PY

      - name: Create or update PR and enable auto-merge
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            BRANCH="$REF_NAME"
            if gh pr view "$BRANCH" >/dev/null 2>&1; then
              PR_URL="$(gh pr view "$BRANCH" --json url --jq .url)"
            else
              PR_URL="$(gh pr create --base main --head "$BRANCH" \
                --title "Automated PR: $BRANCH" \
                --body "Automatically opened for branch `$BRANCH`. Validation runs in this workflow.\n\nPlease review the diff and linked issue context.")"
            fi
          else
            PR_URL="$(gh pr view "$PR_NUMBER" --json url --jq .url)"
            if [ "$PR_AUTHOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
              echo "PR author is not the repository owner; leaving it for normal review."
              exit 0
            fi
            if [ "$PR_HEAD_REPO" != "$GH_REPO" ]; then
              echo "Cross-repository PR; automatic merge is disabled."
              exit 0
            fi
            if [ "$PR_DRAFT" = "true" ]; then
              echo "Draft PR; automatic merge is disabled until it is ready."
              exit 0
            fi
          fi

          # Enable GitHub auto-merge. GitHub still enforces active branch rules,
          # including the configured Copilot review rule and any required checks.
          gh pr merge "$PR_URL" --auto --squash

  issue-triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Add issue type and triage labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ""}`.toLowerCase();
            const candidates = [
              { name: "type:bug", color: "d73a4a", description: "Bug or defect report" },
              { name: "type:feature", color: "a2eeef", description: "Feature request" },
              { name: "type:question", color: "d876e3", description: "Question or clarification" },
              { name: "type:documentation", color: "0075ca", description: "Documentation improvement" },
              { name: "triage:needs-review", color: "fbca04", description: "Needs maintainer triage" }
            ];

            for (const label of candidates) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label
                });
              }
            }

            let type = "type:question";
            if (/bug|error|crash|broken|regression|fails?/.test(text)) type = "type:bug";
            else if (/feature|enhancement|add support|new capability/.test(text)) type = "type:feature";
            else if (/documentation|readme|docs|typo/.test(text)) type = "type:documentation";

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [type, "triage:needs-review"]
            });
